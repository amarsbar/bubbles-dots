# ─────────────────────────────────────────────
#  Hyprland Config
# ─────────────────────────────────────────────

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf

# ─── Monitor ───
# https://wiki.hypr.land/Configuring/Monitors/
monitor = eDP-1, 3840x2400@60, 0x0, 2.34
monitor = eDP-1, addreserved, 0, 35, 0, 0
monitor = , preferred, auto, 1

# ─── General ───
general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2

    col.active_border = rgba(ffffff30) rgba(ffffff10) 45deg
    col.inactive_border = rgba(00000030)

    layout = dwindle
    allow_tearing = false
}

# ─── Decoration ───
decoration {
    rounding = 12

    blur {
        enabled = true
        size = 7
        passes = 3
        noise = 0.01
        contrast = 0.95
        brightness = 1.0
        vibrancy = 0.25
        vibrancy_darkness = 0.0
        new_optimizations = true
        popups = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000040)
    }

    active_opacity = 1.0
    inactive_opacity = 0.95
}

# ─── Animations ───
animations {
    enabled = true

    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    bezier = snappy, 0.2, 1.0, 0.3, 1.0
    bezier = softOut, 0.16, 1, 0.3, 1

    animation = windows, 1, 5, smooth, popin 80%
    animation = windowsIn, 1, 4, snappy, popin 80%
    animation = windowsOut, 1, 4, softOut, popin 80%
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, snappy, slide
    animation = border, 1, 8, smooth
    animation = borderangle, 1, 30, smooth, loop
}

# ─── Layout ───
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

# ─── Input ───
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
    }
}

# ─── Misc ───
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# ─── Layer rules ───
# Compositor blur behind Quickshell surfaces. ignore_alpha is below the
# pill fill's minimum alpha (~0.07) so blur reaches the interior.
layerrule = blur on, match:namespace .*quickshell.*
layerrule = ignore_alpha 0.03, match:namespace .*quickshell.*

# ─── Debug ───
debug {
    disable_logs = false
}
